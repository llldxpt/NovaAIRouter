<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaAIRouter 管理器</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #fff;
      --line: #e4e7ec;
      --text: #1f2328;
      --sub: #667085;
      --primary: #2f6bff;
      --danger: #f04438;
      --ok: #12b76a;
      --shadow: 0 8px 22px rgba(16,24,40,.06);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .app { max-width: 1180px; margin: 0 auto; padding: 18px; }
    .top { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; }
    .top h1 { margin:0; font-size:20px; }
    .top p { margin:4px 0 0; color:var(--sub); font-size:13px; }
    .status { display:flex; gap:8px; flex-wrap:wrap; }
    .pill { border:1px solid var(--line); border-radius:999px; background:#f8f9fc; padding:6px 10px; font-size:12px; }
    .pill.ok { color:#067647; border-color:#a6f4c5; background:#ecfdf3; }
    .pill.bad { color:#b42318; border-color:#fecdca; background:#fef3f2; }

    .tabs { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
    .tab-btn { border:1px solid var(--line); background:#fff; color:#344054; border-radius:10px; padding:8px 12px; font-size:13px; cursor:pointer; }
    .tab-btn.active { border-color: var(--primary); color: var(--primary); background:#eff4ff; }

    .panel { margin-top:12px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; display:none; }
    .panel.active { display:block; }
    .panel h2 { margin:0 0 6px; font-size:17px; }
    .panel .desc { margin:0 0 14px; color:var(--sub); font-size:13px; }

    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field label { display:block; margin-bottom:6px; color:#475467; font-size:12px; }
    .field input, .field select { width:100%; border:1px solid #d0d5dd; border-radius:10px; padding:9px 10px; font-size:13px; }
    .field .hint { margin-top:6px; color:#667085; font-size:12px; line-height:1.4; }

    .actions { margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }
    button { border:1px solid transparent; border-radius:10px; cursor:pointer; padding:9px 14px; font-size:13px; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-light { background:#fff; border-color:#d0d5dd; color:#344054; }
    .btn-danger { background:#fff; border-color:#fda29b; color:var(--danger); }
    .preset-box { margin-top: 10px; padding: 10px 12px; border:1px solid var(--line); border-radius:10px; background:#fafbff; }
    .preset-box .title { font-size:12px; color:#475467; margin-bottom:8px; }
    .preset-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .preset-actions button { padding:7px 10px; font-size:12px; }

    .advanced-toggle { margin-top:10px; font-size:13px; color:var(--primary); cursor:pointer; display:inline-block; }
    .advanced { margin-top:12px; padding-top:12px; border-top:1px dashed #d0d5dd; display:none; }
    .advanced.show { display:block; }

    .table-wrap { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid var(--line); text-align:left; padding:10px; font-size:13px; }
    th { background:#f8f9fc; color:#475467; font-weight:600; }
    tr:last-child td { border-bottom:none; }

    .tag { display:inline-block; border-radius:999px; padding:3px 8px; font-size:12px; }
    .tag.ok { background:#ecfdf3; color:#067647; }
    .tag.bad { background:#fef3f2; color:#b42318; }

    .iframe-wrap { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; }
    iframe { width:100%; height:78vh; border:0; }

    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <div>
        <h1>路由服务管理</h1>
        <p id="topStatusHint">当前配置已生效</p>
      </div>
      <div class="status">
        <div id="s-running" class="pill">服务状态：加载中</div>
        <div id="s-impact" class="pill">可用性：评估中</div>
        <div id="s-mode" class="pill">访问范围：-</div>
      </div>
    </section>

    <div class="tabs">
      <button class="tab-btn active" data-tab="config">基础设置</button>
      <button class="tab-btn" data-tab="plugins">扩展能力</button>
      <button class="tab-btn" data-tab="router">详细页面</button>
    </div>

    <section id="tab-config" class="panel active">
      <h2>基础设置</h2>
      <p class="desc">设置谁可以访问本机服务。账户模式会自动使用你当前登录的账户身份。</p>

      <div id="mainConfigGrid" class="grid"></div>

      <div class="advanced-toggle" onclick="toggleAdvanced()" id="advancedToggle">更多设置（一般不用改）</div>
      <div id="advancedConfig" class="advanced">
        <div class="preset-box">
          <div class="title">使用场景（自动设置）</div>
          <div class="preset-actions">
            <button class="btn-light" onclick="applyPreset('stable')">稳定优先</button>
            <button class="btn-light" onclick="applyPreset('balanced')">均衡模式</button>
            <button class="btn-light" onclick="applyPreset('performance')">高性能优先</button>
          </div>
        </div>
        <div id="advancedConfigGrid" class="grid" style="margin-top:10px;"></div>
      </div>

      <div class="actions">
        <button class="btn-primary" onclick="saveConfig()">保存</button>
        <button class="btn-light" onclick="restoreDefaultsByUser()">恢复默认设置</button>
        <button class="btn-danger" onclick="restartRouterByUser()">重启生效</button>
      </div>
      <p id="restartHint" class="desc" style="margin-top:10px;color:#b42318;display:none;">你有新设置尚未生效。重启后生效，可能短暂影响当前使用。</p>
      <div id="changeSummaryBox" class="preset-box" style="display:none; margin-top:10px;">
        <div class="title">你刚刚修改了</div>
        <ul id="changeSummary" style="margin:0; padding-left:18px; color:#344054; font-size:12px;"></ul>
      </div>
      <p class="desc" style="margin-top:6px;">建议：业务空闲时再执行重启，可以减少对正在进行任务的影响。</p>
    </section>

    <section id="tab-plugins" class="panel">
      <h2>扩展能力</h2>
      <p class="desc">查看当前可用的扩展能力。若为空，表示暂未启用。</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>能力名称</th>
              <th>覆盖设备</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="pluginRows">
            <tr><td colspan="3">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="actions">
        <button class="btn-light" onclick="loadPlugins()">刷新插件列表</button>
      </div>
    </section>

    <section id="tab-router" class="panel">
      <h2>详细页面</h2>
      <p class="desc">这里显示完整信息，通常只在排查问题时使用。</p>
      <div class="iframe-wrap">
        <iframe id="routerFrame" src="about:blank"></iframe>
      </div>
    </section>
  </main>

  <script>
    let configState = {};
    let mainKeys = [];
    let advancedKeys = [];

    const DEFAULT_PRESET = {
      'auth-mode': 'account',
      'log-level': 'error',
      'default-max-concurrency': 10,
      'queue-capacity': 1000,
      'backend-timeout': '300s',
      'queue-timeout': '300s',
      'heartbeat-timeout': '15s'
    };

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${tab}`).classList.add('active');

        if (tab === 'plugins') await loadPlugins();
        if (tab === 'router') await loadRouterPage();
      });
    });

    async function api(url, options = {}) {
      const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
      if (!res.ok) throw new Error(data.error || data.raw || `HTTP ${res.status}`);
      return data;
    }

    function toast(msg) { alert(msg); }

    function getLabel(key) {
      const map = {
        'auth-mode': '访问范围',
        'log-level': '记录级别',
        'default-max-concurrency': '同时处理上限',
        'queue-capacity': '等待上限',
        'backend-timeout': '单次处理最长等待',
        'queue-timeout': '排队最长等待',
        'heartbeat-timeout': '连接检查间隔'
      };
      return map[key] || key;
    }

    function getHint(key) {
      const map = {
        'auth-mode': '公开共享：局域网可访问；仅限账户：需登录账户；仅限本机：仅本机可访问。',
        'log-level': '一般保持默认即可，排查问题时再调高。',
        'default-max-concurrency': '值越大，同时处理越多，但机器压力也更大。',
        'queue-capacity': '高峰时可排队的数量，过小会更早提示繁忙。',
        'backend-timeout': '单次请求最多等待多久。',
        'queue-timeout': '请求最多排队多久。',
        'heartbeat-timeout': '检查服务是否可用的间隔。'
      };
      return map[key] || '';
    }

    function createInputFor(key, value) {
      let input;
      if (key === 'auth-mode') {
        input = document.createElement('select');
        input.innerHTML = '<option value="public">公开共享（局域网可用）</option><option value="account">仅限账户（需登录）</option><option value="local">仅限本机（仅本机可用）</option>';
        input.value = value ?? 'public';
      } else if (key === 'log-level') {
        input = document.createElement('select');
        input.innerHTML = '<option value="debug">调试</option><option value="info">信息</option><option value="warn">警告</option><option value="error">错误</option>';
        input.value = value ?? 'info';
      } else if (key === 'default-max-concurrency' || key === 'queue-capacity') {
        input = document.createElement('input');
        input.type = 'number';
        input.min = '1';
        input.value = value ?? 1;
      } else {
        input = document.createElement('input');
        input.value = value ?? '';
      }
      input.id = `cfg_${key}`;
      return input;
    }

    function renderConfigSection(containerId, keys) {
      const grid = document.getElementById(containerId);
      grid.innerHTML = '';
      keys.forEach((key) => {
        const field = document.createElement('div');
        field.className = 'field';
        const label = document.createElement('label');
        label.textContent = getLabel(key);
        field.appendChild(label);
        field.appendChild(createInputFor(key, configState[key]));
        const hint = getHint(key);
        if (hint) {
          const hintEl = document.createElement('div');
          hintEl.className = 'hint';
          hintEl.textContent = hint;
          field.appendChild(hintEl);
        }
        grid.appendChild(field);
      });
    }

    function renderConfigForm() {
      renderConfigSection('mainConfigGrid', mainKeys);
      renderConfigSection('advancedConfigGrid', advancedKeys);
    }

    async function loadMeta() {
      const data = await api('/api/meta');
      mainKeys = data.mainConfigKeys || [];
      advancedKeys = data.advancedConfigKeys || [];
    }

    async function loadConfig() {
      const data = await api('/api/config');
      configState = data.config || {};
      renderConfigForm();
      updateStatusPills();
    }

    function humanValue(key, val) {
      if (key === 'auth-mode') return modeText(val);
      if (key === 'log-level') {
        const m = { debug: '调试', info: '信息', warn: '警告', error: '错误' };
        return m[val] || val;
      }
      return String(val ?? '');
    }

    function renderChangeSummary(changes) {
      const box = document.getElementById('changeSummaryBox');
      const ul = document.getElementById('changeSummary');
      if (!changes.length) {
        box.style.display = 'none';
        ul.innerHTML = '';
        return;
      }
      ul.innerHTML = changes.map(c => `<li>${escapeHtml(getLabel(c.key))}：${escapeHtml(c.before)} -> ${escapeHtml(c.after)}</li>`).join('');
      box.style.display = 'block';
    }

    async function saveConfig() {
      const payload = {};
      const changes = [];
      [...mainKeys, ...advancedKeys].forEach((k) => {
        const el = document.getElementById(`cfg_${k}`);
        if (!el) return;
        payload[k] = el.value;
        const before = humanValue(k, configState[k]);
        const after = humanValue(k, payload[k]);
        if (before !== after) {
          changes.push({ key: k, before, after });
        }
      });
      payload['default-max-concurrency'] = Number(payload['default-max-concurrency']);
      payload['queue-capacity'] = Number(payload['queue-capacity']);

      if (payload['auth-mode'] === 'public') {
        // 公开共享：不需要 API key（后端会清空）
      }

      const data = await api('/api/config', { method: 'POST', body: JSON.stringify(payload) });
      configState = data.config || {};
      renderConfigForm();
      updateStatusPills();
      renderChangeSummary(changes);

      if (data.restartRequired) {
        document.getElementById('restartHint').style.display = 'block';
        const confirmed = confirm('设置已保存。\n重启后新设置才会生效。\n\n重启会短暂影响当前使用，是否现在重启？');
        if (confirmed) {
          await restartRouterByUser(true);
        }
      } else {
        document.getElementById('restartHint').style.display = 'none';
      }

      if (!changes.length) {
        toast('没有检测到参数变化');
      } else {
        toast('设置已保存');
      }
    }

    function modeText(mode) {
      if (mode === 'public') return '公开共享';
      if (mode === 'account') return '仅限账户';
      if (mode === 'local') return '仅本机';
      return mode || '-';
    }

    function impactText(statusRunning, restartRequired) {
      if (!statusRunning) return '当前不可用';
      if (restartRequired) return '有设置待生效';
      return '当前可用';
    }

    function updateTopHint(statusRunning, restartRequired) {
      const el = document.getElementById('topStatusHint');
      if (!el) return;
      if (!statusRunning) {
        el.textContent = '服务未运行，请重启生效。';
        return;
      }
      if (restartRequired) {
        el.textContent = '有新设置待重启生效。';
        return;
      }
      el.textContent = '当前配置已生效';
    }

    function updateStatusPills(status = null) {
      const runningPill = document.getElementById('s-running');
      const impactPill = document.getElementById('s-impact');
      const modePill = document.getElementById('s-mode');
      modePill.textContent = `访问范围：${modeText(configState['auth-mode'])}`;

      const restartRequired = document.getElementById('restartHint').style.display !== 'none';

      if (!status) {
        runningPill.textContent = '服务状态：未知';
        impactPill.textContent = `业务影响：${impactText(false, restartRequired)}`;
        return;
      }

      if (status.running) {
        runningPill.textContent = '服务状态：运行中';
        runningPill.className = 'pill ok';
      } else {
        runningPill.textContent = '服务状态：未运行';
        runningPill.className = 'pill bad';
      }

      const impact = impactText(status.running, restartRequired);
      impactPill.textContent = `可用性：${impact}`;
      impactPill.className = restartRequired || !status.running ? 'pill bad' : 'pill ok';
      updateTopHint(status.running, restartRequired);
    }

    async function refreshStatus() {
      const data = await api('/api/router/status');
      const view = data.userView || null;
      if (view) {
        configState['auth-mode'] = view.mode || configState['auth-mode'];
      }
      updateStatusPills(data.status);
    }

    async function restartRouterByUser(skipConfirm = false) {
      if (!skipConfirm) {
        const confirmed = confirm('将重启并生效。\n\n这可能短暂影响当前使用，是否继续？');
        if (!confirmed) return;
      }
      await api('/api/router/restart', { method: 'POST', body: JSON.stringify({ confirm: true }) });
      document.getElementById('restartHint').style.display = 'none';
      await refreshStatus();
      toast('路由已重启，新设置已生效');
    }

    async function restoreDefaultsByUser() {
      const confirmed = confirm('将恢复默认设置并立即保存。\n\n保存后仍需重启才会完全生效，是否继续？');
      if (!confirmed) return;

      Object.entries(DEFAULT_PRESET).forEach(([key, value]) => {
        const el = document.getElementById(`cfg_${key}`);
        if (el) el.value = String(value);
      });

      await saveConfig();
      toast('默认设置已恢复并保存');
    }

    function toggleAdvanced() {
      const box = document.getElementById('advancedConfig');
      const btn = document.getElementById('advancedToggle');
      const show = !box.classList.contains('show');
      box.classList.toggle('show', show);
      btn.textContent = show ? '收起高级参数' : '展开高级参数';
    }

    function applyPreset(type) {
      const presets = {
        stable: {
          'backend-timeout': '300s',
          'queue-timeout': '60s',
          'heartbeat-timeout': '20s'
        },
        balanced: {
          'backend-timeout': '180s',
          'queue-timeout': '30s',
          'heartbeat-timeout': '15s'
        },
        performance: {
          'backend-timeout': '120s',
          'queue-timeout': '15s',
          'heartbeat-timeout': '10s'
        }
      };
      const selected = presets[type];
      if (!selected) return;

      Object.entries(selected).forEach(([key, value]) => {
        const el = document.getElementById(`cfg_${key}`);
        if (el) el.value = value;
      });

      document.getElementById('restartHint').style.display = 'block';
      updateStatusPills({ running: true });
      const msg = type === 'stable' ? '已套用：稳定优先（更稳）' : type === 'balanced' ? '已套用：均衡模式（推荐）' : '已套用：高性能优先（更快）';
      toast(msg + '，请点击“保存”后生效');
    }

    async function loadPlugins() {
      const rows = document.getElementById('pluginRows');
      rows.innerHTML = '<tr><td colspan="3">加载中...</td></tr>';
      try {
        const data = await api('/api/plugins');
        const list = Array.isArray(data.plugins) ? data.plugins : [];
        if (!list.length) {
          rows.innerHTML = '<tr><td colspan="3">当前未启用扩展能力</td></tr>';
          return;
        }

        rows.innerHTML = list.map((p) => {
          const state = p.healthy ? '<span class="tag ok">可用</span>' : '<span class="tag bad">异常</span>';
          return `
            <tr>
              <td>${escapeHtml(p.name || '-')}</td>
              <td>${p.nodesCount ?? 0} 台设备</td>
              <td>${state}</td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        rows.innerHTML = `<tr><td colspan="3">加载失败：${escapeHtml(e.message)}</td></tr>`;
      }
    }

    async function loadRouterPage() {
      const data = await api('/api/router/page-url');
      document.getElementById('routerFrame').src = data.url;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function boot() {
      await loadMeta();
      await loadConfig();
      await refreshStatus();
      try {
        const rr = await api('/api/router/restart-required');
        document.getElementById('restartHint').style.display = rr.pendingRestart ? 'block' : 'none';
      } catch {}
      setInterval(refreshStatus, 2500);
    }

    boot().catch((e) => toast(e.message));
  </script>
</body>
</html>
